[project]
name = "oneintoone-cloudflare-api-compat"
version = "0.1.0"
description = "Compatibility probe for the existing 1into1 FastAPI backend on Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.0.0",
  "firebase-admin",
  "groq>=0.5.0",
  "httpx>=0.27.0"
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk"
]
