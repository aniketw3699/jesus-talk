<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HZPYCF859M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Sacred Blessing Prepared For You | You With Jesus</title>
  <meta name="description" content="A personal prayer and Scripture promise was lifted up for you today." />
  <link rel="canonical" href="https://jesus-chat-bd89f.web.app/blessing.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d1117;
      --gold: #e2b764;
      --gold-glow: rgba(226, 183, 100, 0.2);
      --border: rgba(226, 183, 100, 0.35);
      --card-bg: rgba(255, 255, 255, 0.04);
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg) url('card-bg.png') center top/cover no-repeat fixed;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .blessing-container {
      max-width: 480px; width: 100%;
      background: rgba(13, 17, 23, 0.92); backdrop-filter: blur(14px);
      border: 1.5px solid var(--border); border-radius: 24px;
      padding: 32px 24px; text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .cross-icon { color: #d90429; font-size: 18px; margin-bottom: 8px; display: inline-block; }
    .header-sub { font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-family: 'Cinzel', serif; font-size: 22px; color: #ffffff; line-height: 1.35; margin-bottom: 20px; }
    
    .blessing-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px 20px; margin-bottom: 24px;
      text-align: left;
    }
    .blessing-text {
      font-family: 'Montserrat', sans-serif; font-size: 14.5px;
      line-height: 1.7; color: #f8fafc; margin-bottom: 12px;
    }
    .blessing-watermark {
      font-family: 'Cinzel', serif; font-size: 10px; color: var(--gold);
      text-align: center; letter-spacing: 1.5px; border-top: 1px solid rgba(226,183,100,0.2);
      padding-top: 10px; margin-top: 14px;
    }
    
    .btn-row { display: flex; flex-direction: column; gap: 10px; }
    .primary-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #dfb455 0%, #b88628 100%);
      border: none; border-radius: 14px; color: #000; font-weight: 800; font-size: 14.5px;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(226, 183, 100, 0.35); transition: transform 0.2s;
    }
    .primary-btn:hover { transform: translateY(-2px); }
    .secondary-btn {
      width: 100%; padding: 12px; background: transparent;
      border: 1px solid var(--border); border-radius: 14px; color: var(--gold);
      font-weight: 700; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
  </style>
</head>
<body>
  <main class="blessing-container">
    <span class="cross-icon">✝</span>
    <div class="header-sub">SACRED INTERCESSION</div>
    <h1 id="recipientTitle">A Blessing For You</h1>

    <div class="blessing-card">
      <p class="blessing-text" id="blessingMessage">
        “Peace be with you. Lay down what burdens your spirit today, for you are covered in grace and never forgotten.”
      </p>
      <div class="blessing-watermark">YOU WITH JESUS • SACRED SANCTUARY</div>
    </div>

    <div class="btn-row">
      <button class="secondary-btn" id="listenBtn" onclick="listenToSharedBlessing()">
        🔊 Listen to Spoken Blessing
      </button>
      <a href="index.html" class="primary-btn">
        <span>✝</span> Enter Sanctuary & Pray For Yourself
      </a>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const recipient = urlParams.get('recipient');
    const text = urlParams.get('text');

    if (recipient) {
      document.getElementById('recipientTitle').textContent = `A Blessing For ${recipient}`;
      document.title = `A Sacred Blessing For ${recipient} | You With Jesus`;
    }
    if (text) {
      document.getElementById('blessingMessage').textContent = `“${decodeURIComponent(text).replace(/^["“]|["”]$/g, '')}”`;
    }

    function listenToSharedBlessing() {
      if (!('speechSynthesis' in window)) {
        alert("Audio speech is not supported on this browser.");
        return;
      }
      if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        document.getElementById('listenBtn').innerHTML = "🔊 Listen to Spoken Blessing";
        return;
      }

      const msg = document.getElementById('blessingMessage').textContent;
      const cleanText = msg.replace(/<[^>]*>/g, '').replace(/[\(\)\[\]"“”]/g, ' ');
      const utterance = new SpeechSynthesisUtterance(cleanText);

      const voices = speechSynthesis.getVoices();
      const daniel = voices.find(v => (v.name || '').toLowerCase().includes('daniel') && !v.name.toLowerCase().includes('female'));
      if (daniel) utterance.voice = daniel;
      utterance.rate = 0.82;
      utterance.pitch = 0.80;

      document.getElementById('listenBtn').innerHTML = "⏸ Pause Audio";
      utterance.onend = () => { document.getElementById('listenBtn').innerHTML = "🔊 Listen to Spoken Blessing"; };
      utterance.onerror = () => { document.getElementById('listenBtn').innerHTML = "🔊 Listen to Spoken Blessing"; };

      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
