name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Frontend base URL"
        required: true
        default: "https://www.1into1.com"
      api_url:
        description: "Backend API base URL"
        required: true
        default: "https://jesus-talk-dusky.vercel.app"
      strict:
        description: "Require billing + encrypted backup fully activated"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run production smoke
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.strict }}" = "true" ]; then EXTRA="--strict"; fi
          python production_smoke.py \
            --base-url "${{ inputs.base_url }}" \
            --api-url "${{ inputs.api_url }}" \
            $EXTRA
