name: Programmatic SEO Auto-Generator

on:
  schedule:
    - cron: '0 0,12 * * *' # Runs at 00:00 & 12:00 UTC
  workflow_dispatch:

jobs:
  generate_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq python-dotenv

      - name: Run Programmatic SEO Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python auto_seo_engine.py

      - name: Commit & Push Generated Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prayers/ blogs.html sitemap.xml published_slugs.json
          git diff --staged --quiet || (git commit -m "Auto-generate 1200w SEO prayer guide [skip ci]" && git push)
