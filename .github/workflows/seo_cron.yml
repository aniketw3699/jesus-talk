name: Manual SEO Editorial Generator

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Number of reviewed devotional drafts to generate"
        required: false
        default: "1"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install groq python-dotenv

      - name: Generate editorial draft
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DOMAINS_URL: https://www.1into1.com
        run: python auto_seo_engine.py --batch "${{ inputs.batch }}"

      - name: Validate generated SEO files
        run: |
          python seo_audit.py
          python launch_audit.py

      - name: Create review branch
        id: editorial
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add blogs/ blogs.html sitemap.xml published_slugs.json topics.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes to review."
            exit 0
          fi

          BRANCH="seo/editorial-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "Generate devotional draft for editorial review"
          git push origin "$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open editorial review PR
        if: steps.editorial.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: ${{ steps.editorial.outputs.branch }}
        run: |
          gh pr create             --base main             --head "$REVIEW_BRANCH"             --title "SEO editorial draft for review"             --body "Generated by the manual SEO editorial workflow. Review Scripture references, search intent, duplication/cannibalization risk, factual accuracy, internal links, and usefulness before merging. This workflow does not auto-deploy generated content."
