name: Automated Daily SEO Devotionals

on:
  schedule:
    # Runs at 23:30 UTC (5:00 AM IST) and 11:30 UTC (5:00 PM IST) every day
    - cron: '30 23,11 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install groq python-dotenv

      - name: Run SEO Engine (Generate 2 Articles)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DOMAINS_URL: https://jesus-chat-bd89f.web.app
        run: |
          python auto_seo_engine.py --batch 2

      - name: Commit & Push Generated Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blogs/ blogs.html sitemap.xml published_slugs.json topics.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new articles generated in this run."
          else
            git commit -m "Auto-generate 2 daily devotionals [skip ci]"
            git push origin main
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESUS_CHAT_BD89F || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: jesus-chat-bd89f