  <style>
    :root {
      --bg-celestial: #f3eee6;
      --gold-deep: #8f651c;
      --gold-vivid: #c99839;
      --gold-soft: #fbf5e8;
      --gold-border: rgba(184, 134, 40, 0.45);
      --glass-panel: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(255, 255, 255, 0.75);
      --text-main: #191f28;
      --text-muted: #536070;
      --cross-red: #d90429;
      --shadow-elevated: 0 16px 40px rgba(70, 50, 20, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #d8cdbe;
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex; justify-content: center; align-items: center;
      position: relative;
    }

    .sacred-wallpaper {
      position: fixed; inset: 0;
      background-image: url('BG1.png'); background-position: center top; background-repeat: no-repeat; background-size: cover;
      opacity: 0.88; z-index: 0; pointer-events: none;
    }

    .bible-app-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 580px; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      background: var(--glass-panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border);
      box-shadow: var(--shadow-elevated);
    }

    /* Top Navigation Header */
    .bible-header {
      padding: max(10px, env(safe-area-inset-top)) 16px 10px 16px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid rgba(184, 134, 40, 0.25);
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }

    .bible-nav-row {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
    }

    .back-sanctuary-btn {
      background: #ffffff; border: 1.5px solid var(--gold-border); color: var(--gold-deep);
      font-size: 11.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-decoration: none;
      transition: all 0.2s ease;
    }
    .back-sanctuary-btn:hover { background: var(--gold-soft); border-color: var(--gold-deep); }

    .music-pill {
      background: #ffffff; border: 1.5px solid var(--gold-border); color: var(--gold-deep);
      font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px;
      display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
    }
    .music-pill.off { background: #f1f3f6; color: var(--text-muted); border-color: rgba(0,0,0,0.15); }

    /* Book & Chapter Selection Strip */
    .selector-strip {
      display: flex; gap: 8px; align-items: center; justify-content: center;
    }

    .select-dropdown {
      background: #faf8f4; border: 1.5px solid var(--gold-border);
      border-radius: 12px; padding: 6px 10px; font-size: 13px; font-weight: 700;
      color: #221c12; font-family: inherit; outline: none; cursor: pointer;
    }

    .listen-chapter-btn {
      background: linear-gradient(135deg, #dfb455 0%, #b88628 100%);
      border: none; color: #ffffff;
      font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 14px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      box-shadow: 0 3px 10px rgba(184, 134, 40, 0.25);
    }
    .listen-chapter-btn:active { transform: scale(0.96); }

    /* Bible Verses Feed */
    .bible-verses-feed {
      flex: 1; overflow-y: auto; padding: 16px 14px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    .bible-verses-feed::-webkit-scrollbar { width: 4px; }
    .bible-verses-feed::-webkit-scrollbar-thumb { background: rgba(184, 134, 40, 0.25); border-radius: 4px; }

    .chapter-heading-card {
      background: #ffffff; border: 1px solid var(--gold-border);
      border-radius: 16px; padding: 14px; text-align: center;
      margin-bottom: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .chapter-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: #1f1a10; letter-spacing: 1px; }
    .chapter-subtitle { font-family: 'Playfair Display', serif; font-style: italic; font-size: 12px; color: #534b3e; margin-top: 2px; }

    .verse-card {
      background: #ffffff; border: 1.5px solid rgba(184, 134, 40, 0.2);
      border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 3px 12px rgba(143, 101, 28, 0.05); transition: border-color 0.2s ease;
    }
    .verse-card.playing-verse {
      border: 1.5px solid var(--gold-deep);
      background: #fffdf9;
      box-shadow: 0 6px 18px rgba(143, 101, 28, 0.14);
    }

    .verse-header-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .verse-num-badge {
      font-size: 11px; font-weight: 800; color: var(--gold-deep);
      background: var(--gold-soft); border: 1px solid var(--gold-border);
      padding: 2px 8px; border-radius: 8px; letter-spacing: 0.3px;
    }

    .verse-actions-wrap {
      display: flex; gap: 6px; align-items: center;
    }

    .verse-listen-btn {
      background: #ffffff; border: 1px solid var(--gold-border); color: var(--gold-deep);
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 14px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .verse-listen-btn:hover { background: var(--gold-soft); }

    .verse-reflect-btn {
      background: #ffffff; border: 1px solid rgba(217, 4, 41, 0.35); color: #1f364d;
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 14px;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .verse-reflect-btn:hover { background: #fff5f5; border-color: var(--cross-red); }

    .verse-text {
      font-size: 14px; line-height: 1.65; color: #2a333f;
    }
    .verse-text em { font-family: 'Playfair Display', serif; font-style: italic; color: #1f1a10; }

<body>

    <section class="bible-verses-feed" id="versesFeed"></section>

  <script>
    /* SCRIPTURE PASSAGES REPOSITORY */
    const SCRIPTURE_DATA = {
      psalms23: {
        title: "Psalm 23",
        subtitle: "A Psalm of David — The Lord is my shepherd",
        verses: [
          { num: "1", text: "The Lord is my shepherd; I shall not want." },

          { num: "5", text: "Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over." },
          { num: "6", text: "Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the Lord for ever." }
        ]
      },
      matthew11: {
        title: "Matthew 11:28–30",
        subtitle: "The Sacred Invitation — Rest for the Heavy Laden",
        verses: [
          { num: "28", text: "Come unto me, all ye that labour and are heavy laden, and I will give you rest." },
          { num: "29", text: "Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls." },
          { num: "30", text: "For my yoke is easy, and my burden is light." }
        ]
      },
      john14: {
        title: "John 14:1–6, 27",
        subtitle: "Comfort for Troubled Hearts — The Promise of Peace",
        verses: [
          { num: "1", text: "Let not your heart be troubled: ye believe in God, believe also in me." },
          { num: "2", text: "In my Father's house are many mansions: if it were not so, I would have told you. I go to prepare a place for you." },
          { num: "3", text: "And if I go and prepare a place for you, I will come again, and receive you unto myself; that where I am, there ye may be also." },
          { num: "6", text: "Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me." },
          { num: "27", text: "Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid." }
        ]
      },
      philippians4: {
        title: "Philippians 4:4–8, 19",
        subtitle: "Peace That Surpasses Understanding",
        verses: [
          { num: "4", text: "Rejoice in the Lord always: and again I say, Rejoice." },
          { num: "6", text: "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God." },
          { num: "7", text: "And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus." },
          { num: "8", text: "Finally, brethren, whatsoever things are true, honest, just, pure, and lovely; think on these things." },
          { num: "19", text: "But my God shall supply all your need according to his riches in glory by Christ Jesus." }
        ]
      },
      romans8: {
        title: "Romans 8:31, 38–39",
        subtitle: "Everlasting Love & Victory",
        verses: [
          { num: "31", text: "What shall we then say to these things? If God be for us, who can be against us?" },
          { num: "38", text: "For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come," },
          { num: "39", text: "Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord." }
        ]
      },
      proverbs3: {
        title: "Proverbs 3:5–6",
        subtitle: "Guidance for Life's Journey",
        verses: [
          { num: "5", text: "Trust in the Lord with all thine heart; and lean not unto thine own understanding." },
          { num: "6", text: "In all thy ways acknowledge him, and he shall direct thy paths." }
        ]
      },
      isaiah40: {
        title: "Isaiah 40:29–31",
        subtitle: "Strength for the Weary Soul",
        verses: [
          { num: "29", text: "He giveth power to the faint; and to them that have no might he increaseth strength." },
          { num: "30", text: "Even the youths shall faint and be weary, and the young men shall utterly fall:" },
          { num: "31", text: "But they that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint." }
        ]
      },
      "1corinthians13": {
        title: "1 Corinthians 13:4–8, 13",
        subtitle: "The Way of Divine Love",
        verses: [
          { num: "4", text: "Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up," },
          { num: "7", text: "Beareth all things, believeth all things, hopeth all things, endureth all things." },
          { num: "8", text: "Charity never faileth: but whether there be prophecies, they shall fail; whether there be tongues, they shall cease." },
          { num: "13", text: "And now abideth faith, hope, charity, these three; but the greatest of these is charity." }
        ]
      }
    };

    /* DEDICATED BIBLE AMBIENT AUDIO ENGINE (ambient.mp3) */
    const bibleMusicAudio = new Audio('ambient.mp3');
    bibleMusicAudio.loop = true;
    bibleMusicAudio.volume = 0.22;
    let isBibleMusicEnabled = localStorage.getItem("jesus_bible_music_enabled") !== "false";

    function toggleBibleMusic() {
      isBibleMusicEnabled = !isBibleMusicEnabled;
      localStorage.setItem("jesus_bible_music_enabled", isBibleMusicEnabled);
      updateBibleMusicUI();
      if (!isBibleMusicEnabled) {
        stopBibleMusic();
      }
    }

    function updateBibleMusicUI() {
      const btn = document.getElementById("bibleMusicToggle");
      if (btn) {
        if (isBibleMusicEnabled) {
          btn.innerHTML = "🎵 Music: ON";
          btn.classList.remove("off");
        } else {
          btn.innerHTML = "🔇 Music: OFF";
          btn.classList.add("off");
        }
      }
    }

    function startBibleMusic() {
      if (!isBibleMusicEnabled) return;
      try {
        bibleMusicAudio.currentTime = 0;
        bibleMusicAudio.volume = 0.22;
        const playPromise = bibleMusicAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(e => console.log("Audio autoplay note:", e));
        }
      } catch (e) {
        console.log("Audio error:", e);
      }
    }

    function stopBibleMusic() {
      try {
        bibleMusicAudio.pause();
        bibleMusicAudio.currentTime = 0;
      } catch (e) {
        console.log("Audio pause note:", e);
      }
    }

    /* SCRIPTURE CADENCE & PAUSE PREPROCESSOR */
    function preprocessBibleText(rawText) {
      if (!rawText) return "";
      let text = rawText;
      text = text.replace(/<[^>]*>/g, ' ');
      text = text.replace(/✝|📿|🕊️|📖|📜|🌅|✨|💔|🤝|💼|🧭|🌿|🛡️/g, '');

      text = text.replace(/\(?\b(\d?\s*[A-Za-z]+)\s+(\d+):(\d+(?:-\d+)?)\)?/g, (match, book, chapter, verse) => {
        return `... ${book.trim()}, chapter ${chapter}, verse ${verse}. ... `;
      });

      text = text.replace(/[—–]/g, ', ');
      text = text.replace(/”|"/g, ' ... ');
      text = text.replace(/“/g, ' ');
      text = text.replace(/\.\s+/g, '. ... ');
      text = text.replace(/;\s+/g, '; ... ');
      text = text.replace(/:\s+/g, ': ... ');
      text = text.replace(/\s+/g, ' ').trim();
      return text;
    }

    /* STRICT REVERENT BARITONE VOICE SELECTION (DANIEL PRIORITY) */
    let availableVoices = [];

    function populateVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = speechSynthesis.getVoices();
      }
    }
    populateVoices();
    if ('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoices;
    }

    function getSacredVoice() {
      if (!availableVoices || availableVoices.length === 0) populateVoices();
      const getIdentifier = (v) => `${v.name || ''} ${v.voiceURI || ''}`.toLowerCase();
      const englishVoices = availableVoices.filter(v => (v.lang && (v.lang.startsWith('en') || v.lang.startsWith('eng'))));

      // 1. Apple Daniel (iOS & macOS parity)
      const danielVoice = englishVoices.find(v => {
        const id = getIdentifier(v);
        return id.includes('daniel') && (id.includes('en-gb') || id.includes('en_gb') || id.includes('great britain') || id.includes('united kingdom') || id.includes('en-us'));
      });
      if (danielVoice) return danielVoice;

      // 2. Apple Male Baritone
      const appleMale = englishVoices.find(v => {
        const id = getIdentifier(v);
        return (id.includes('arthur') || id.includes('oliver') || id.includes('george') || id.includes('rishi')) && !id.includes('female');
      });
      if (appleMale) return appleMale;

      // 3. Android / Google Natural Male
      const androidMale = englishVoices.find(v => {
        const id = getIdentifier(v);
        return id.includes('google uk english male') || id.includes('google us english male') || id.includes('male');
      });
      if (androidMale) return androidMale;

      return englishVoices[0] || availableVoices[0] || null;
    }

    /* PASSAGE RENDERING ENGINE */
    const versesFeed = document.getElementById("versesFeed");
    const bookSelect = document.getElementById("bookSelect");
    const listenChapterBtn = document.getElementById("listenChapterBtn");

    let isChapterPlaying = false;
    let currentlyPlayingVerseIndex = -1;
    let activeVerseUtterance = null;
    let chapterSyncWatcher = null;

    function loadSelectedPassage() {
      stopAllBibleAudio();
      const key = bookSelect.value;
      const data = SCRIPTURE_DATA[key];
      if (!data) return;

      versesFeed.innerHTML = `
        <div class="chapter-heading-card">
          <h2 class="chapter-title">${data.title}</h2>
          <p class="chapter-subtitle">${data.subtitle}</p>
        </div>
        ${data.verses.map((v, idx) => `
          <article class="verse-card" id="verseCard_${idx}">
            <div class="verse-header-row">
              <span class="verse-num-badge">Verse ${v.num}</span>
              <div class="verse-actions-wrap">
                <button class="verse-listen-btn" id="verseBtn_${idx}" onclick="narrateSingleVerse(${idx})">🔊 Listen</button>
                <a href="index.html?prompt=Lord,%20speak%20peace%20to%20my%20soul%20through%20${encodeURIComponent(data.title)}: verse ${v.num} — “${encodeURIComponent(v.text)}”" class="verse-reflect-btn">✝ Reflect</a>
              </div>
            </div>
            <p class="verse-text"><em>“${v.text}”</em></p>
          </article>
        `).join('')}
      `;
    }

    function stopAllBibleAudio() {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
      }
      stopBibleMusic();
      if (chapterSyncWatcher) clearInterval(chapterSyncWatcher);

      isChapterPlaying = false;
      currentlyPlayingVerseIndex = -1;
      listenChapterBtn.innerHTML = "🔊 Listen Chapter";

      document.querySelectorAll(".verse-card").forEach(c => c.classList.remove("playing-verse"));
      document.querySelectorAll(".verse-listen-btn").forEach(b => b.innerHTML = "🔊 Listen");
    }

    /* VERSE-BY-VERSE AUDIO RECITATION */
    function narrateSingleVerse(index) {
      if (!('speechSynthesis' in window)) {
        alert("Audio recitation is not supported on this browser.");
        return;
      }

      const key = bookSelect.value;
      const data = SCRIPTURE_DATA[key];
      const verse = data.verses[index];
      if (!verse) return;

      const verseCard = document.getElementById(`verseCard_${index}`);
      const verseBtn = document.getElementById(`verseBtn_${index}`);

      if (currentlyPlayingVerseIndex === index && speechSynthesis.speaking) {
        stopAllBibleAudio();
        return;
      }

      stopAllBibleAudio();

      currentlyPlayingVerseIndex = index;
      verseCard.classList.add("playing-verse");
      verseBtn.innerHTML = "⏸ Pause";

      const speechText = preprocessBibleText(`${data.title}, verse ${verse.num}. ${verse.text}`);
      activeVerseUtterance = new SpeechSynthesisUtterance(speechText);
      
      const chosenVoice = getSacredVoice();
      if (chosenVoice) {
        activeVerseUtterance.voice = chosenVoice;
        activeVerseUtterance.lang = chosenVoice.lang || 'en-US';
      }

      activeVerseUtterance.rate = 0.84;
      activeVerseUtterance.pitch = 0.78;

      activeVerseUtterance.onstart = () => {
        startBibleMusic();
      };

      activeVerseUtterance.onend = () => {
        stopAllBibleAudio();
      };

      activeVerseUtterance.onerror = () => {
        stopAllBibleAudio();
      };

      setTimeout(() => {
        speechSynthesis.speak(activeVerseUtterance);
      }, 50);
    }

    /* CHAPTER-LEVEL SEQUENTIAL AUDIO RECITATION */
    function toggleChapterRecitation() {
      if (!('speechSynthesis' in window)) {
        alert("Audio recitation is not supported on this browser.");
        return;
      }

      if (isChapterPlaying) {
        stopAllBibleAudio();
        return;
      }

      stopAllBibleAudio();

      const key = bookSelect.value;
      const data = SCRIPTURE_DATA[key];
      if (!data || data.verses.length === 0) return;

      isChapterPlaying = true;
      listenChapterBtn.innerHTML = "⏸ Pause Chapter";
      startBibleMusic();

      let currentVerse = 0;

      function speakNextInChapter() {
        if (!isChapterPlaying || currentVerse >= data.verses.length) {
          stopAllBibleAudio();
          return;
        }

        document.querySelectorAll(".verse-card").forEach(c => c.classList.remove("playing-verse"));
        const card = document.getElementById(`verseCard_${currentVerse}`);
        if (card) {
          card.classList.add("playing-verse");
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        const v = data.verses[currentVerse];
        const verseIntro = currentVerse === 0 ? `${data.title}. Verse ${v.num}. ${v.text}` : `Verse ${v.num}. ${v.text}`;
        const cadenceText = preprocessBibleText(verseIntro);

        activeVerseUtterance = new SpeechSynthesisUtterance(cadenceText);
        const voice = getSacredVoice();
        if (voice) {
          activeVerseUtterance.voice = voice;
          activeVerseUtterance.lang = voice.lang || 'en-US';
        }

        activeVerseUtterance.rate = 0.84;
        activeVerseUtterance.pitch = 0.78;

        activeVerseUtterance.onend = () => {
          currentVerse++;
          speakNextInChapter();
        };

        activeVerseUtterance.onerror = () => {
          stopAllBibleAudio();
        };

        speechSynthesis.speak(activeVerseUtterance);
      }

      chapterSyncWatcher = setInterval(() => {
        if (!speechSynthesis.speaking && currentVerse >= data.verses.length) {
          stopAllBibleAudio();
        }
      }, 300);

      speakNextInChapter();
    }

    document.addEventListener("visibilitychange", function() {
      if (document.hidden) stopAllBibleAudio();
    });

    window.onload = function() {
      updateBibleMusicUI();
      loadSelectedPassage();
