      color: #fff; letter-spacing: 1px; margin-bottom: 6px;

    .offline-bible-status {

    }
/* Controls Bar */
    .controls-grid {
      display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px;
      background: var(--card-bg); border: 1px solid var(--border);

    select {

      font-family: inherit; font-size: 14px; outline: none;

    select:focus { border-color: var(--gold); }

    /* Chapter Navigation Pills */
    .chapter-bar {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px;
      margin-bottom: 24px; scrollbar-width: none;
    }
    .chapter-bar::-webkit-scrollbar { display: none; }
    .chap-pill {
      flex: 0 0 auto; padding: 6px 14px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 20px; color: var(--text-secondary);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .chap-pill.active, .chap-pill:hover {
      background: var(--gold-glow); border-color: var(--gold); color: var(--gold);
    }

    /* Scripture Content Area */
    .scripture-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 24px; min-height: 300px;
    }
    .passage-title-row {

      border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 24px;
    }
    .passage-title {

      text-align: left;
    }
    .listen-chap-btn {
      background: transparent; border: 1.5px solid var(--gold);
      color: var(--gold); font-size: 12px; font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700; padding: 5px 14px; border-radius: 16px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s;
    }
    .listen-chap-btn:hover { background: var(--gold-glow); }

    .verse-row {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
      font-family: 'Playfair Display', serif; font-size: 17px; line-height: 1.8; color: #f4f4f5;

    .verse-row.playing-verse {

    }

    .actions-wrap {

    .loading-spinner {

    .bible-search-panel {

    }
    .bible-search-row { display:flex; gap:8px; }
    .bible-search-input {

    .bible-search-results.visible { display:flex; }
    .bible-search-result {

    .bible-search-result span { font-size:12px; line-height:1.45; color:#c9c7c1; }
    .search-hit { background:rgba(226,183,100,.12) !important; border-color:rgba(226,183,100,.55) !important; }
    .translation-note { font-size:10.5px; color:var(--text-secondary); margin-top:7px; text-align:center; }
    @media (max-width:640px) {

      .bible-search-btn { width:100%; }
      .controls-grid { grid-template-columns:1fr 1fr; }
      #translationSelect { grid-column:1/-1; }
    }

  <script src="/bible-manifest.js"></script>
  <script src="/local-bible-engine.js"></script>
  <script>
    const BIBLE_BOOKS = [
      // Old Testament
      { name: "Genesis", chapters: 50, testament: "OT" },
      { name: "Exodus", chapters: 40, testament: "OT" },
      { name: "Leviticus", chapters: 27, testament: "OT" },
      { name: "Numbers", chapters: 36, testament: "OT" },
      { name: "Deuteronomy", chapters: 34, testament: "OT" },
      { name: "Joshua", chapters: 24, testament: "OT" },
      { name: "Judges", chapters: 21, testament: "OT" },
      { name: "Ruth", chapters: 4, testament: "OT" },
      { name: "1 Samuel", chapters: 31, testament: "OT" },
      { name: "2 Samuel", chapters: 24, testament: "OT" },
      { name: "1 Kings", chapters: 22, testament: "OT" },
      { name: "2 Kings", chapters: 25, testament: "OT" },
      { name: "1 Chronicles", chapters: 29, testament: "OT" },
      { name: "2 Chronicles", chapters: 36, testament: "OT" },
      { name: "Ezra", chapters: 10, testament: "OT" },
      { name: "Nehemiah", chapters: 13, testament: "OT" },
      { name: "Esther", chapters: 10, testament: "OT" },
      { name: "Job", chapters: 42, testament: "OT" },
      { name: "Psalms", chapters: 150, testament: "OT" },

      { name: "Ecclesiastes", chapters: 12, testament: "OT" },
      { name: "Song of Solomon", chapters: 8, testament: "OT" },
      { name: "Isaiah", chapters: 66, testament: "OT" },
      { name: "Jeremiah", chapters: 52, testament: "OT" },
      { name: "Lamentations", chapters: 5, testament: "OT" },
      { name: "Ezekiel", chapters: 48, testament: "OT" },
      { name: "Daniel", chapters: 12, testament: "OT" },
      { name: "Hosea", chapters: 14, testament: "OT" },
      { name: "Joel", chapters: 3, testament: "OT" },
      { name: "Amos", chapters: 9, testament: "OT" },
      { name: "Obadiah", chapters: 1, testament: "OT" },
      { name: "Jonah", chapters: 4, testament: "OT" },
      { name: "Micah", chapters: 7, testament: "OT" },
      { name: "Nahum", chapters: 3, testament: "OT" },
      { name: "Habakkuk", chapters: 3, testament: "OT" },
      { name: "Zephaniah", chapters: 3, testament: "OT" },
      { name: "Haggai", chapters: 2, testament: "OT" },
      { name: "Zechariah", chapters: 14, testament: "OT" },
      { name: "Malachi", chapters: 4, testament: "OT" },

      // New Testament
      { name: "Matthew", chapters: 28, testament: "NT" },
      { name: "Mark", chapters: 16, testament: "NT" },
      { name: "Luke", chapters: 24, testament: "NT" },
      { name: "John", chapters: 21, testament: "NT" },
      { name: "Acts", chapters: 28, testament: "NT" },
      { name: "Romans", chapters: 16, testament: "NT" },
      { name: "1 Corinthians", chapters: 16, testament: "NT" },
      { name: "2 Corinthians", chapters: 13, testament: "NT" },
      { name: "Galatians", chapters: 6, testament: "NT" },
      { name: "Ephesians", chapters: 6, testament: "NT" },
      { name: "Philippians", chapters: 4, testament: "NT" },
      { name: "Colossians", chapters: 4, testament: "NT" },
      { name: "1 Thessalonians", chapters: 5, testament: "NT" },
      { name: "2 Thessalonians", chapters: 3, testament: "NT" },
      { name: "1 Timothy", chapters: 6, testament: "NT" },
      { name: "2 Timothy", chapters: 4, testament: "NT" },
      { name: "Titus", chapters: 3, testament: "NT" },
      { name: "Philemon", chapters: 1, testament: "NT" },
      { name: "Hebrews", chapters: 13, testament: "NT" },
      { name: "James", chapters: 5, testament: "NT" },
      { name: "1 Peter", chapters: 5, testament: "NT" },
      { name: "2 Peter", chapters: 3, testament: "NT" },
      { name: "1 John", chapters: 5, testament: "NT" },
      { name: "2 John", chapters: 1, testament: "NT" },
      { name: "3 John", chapters: 1, testament: "NT" },
      { name: "Jude", chapters: 1, testament: "NT" },
      { name: "Revelation", chapters: 22, testament: "NT" }
    ];

    const bookSelect = document.getElementById("bookSelect");
    const chapterSelect = document.getElementById("chapterSelect");
    const translationSelect = document.getElementById("translationSelect");
    const chapterPills = document.getElementById("chapterPills");
    const passageHeader = document.getElementById("passageHeader");
    const versesContainer = document.getElementById("versesContainer");
    const listenChapBtn = document.getElementById("listenChapBtn");

    let currentLoadedVerses = [];

    /* AMBIENT AUDIO ENGINE (ambient.mp3) */
    const bibleMusicAudio = new Audio('ambient.mp3');
    bibleMusicAudio.loop = true;
    bibleMusicAudio.volume = 0.22;
    let isBibleMusicEnabled = localStorage.getItem("jesus_bible_music_enabled") !== "false";

    function toggleBibleMusic() {
      isBibleMusicEnabled = !isBibleMusicEnabled;
      localStorage.setItem("jesus_bible_music_enabled", isBibleMusicEnabled);
      updateBibleMusicUI();
      if (!isBibleMusicEnabled) stopBibleMusic();
    }

    function updateBibleMusicUI() {
      const btn = document.getElementById("bibleMusicToggle");
      if (btn) {
        btn.innerHTML = isBibleMusicEnabled ? "🎵 Music: ON" : "🔇 Music: OFF";
        btn.classList.toggle("off", !isBibleMusicEnabled);
      }
    }

    function startBibleMusic() {
      if (!isBibleMusicEnabled) return;
      try {
        bibleMusicAudio.currentTime = 0;
        bibleMusicAudio.volume = 0.22;
        bibleMusicAudio.play().catch(e => console.log("Audio play note:", e));
      } catch (e) {}
    }

    function stopBibleMusic() {
      try {
        bibleMusicAudio.pause();
        bibleMusicAudio.currentTime = 0;
      } catch (e) {}
    }

    /* SCRIPTURE CADENCE & PAUSE PREPROCESSOR */
    function preprocessBibleText(rawText) {
      if (!rawText) return "";
      let text = rawText.replace(/<[^>]*>/g, ' ');
      text = text.replace(/✝|📿|🕊️|📖|📜|🌅|✨|💔|🤝|💼|🧭|🌿|🛡️/g, '');
      text = text.replace(/\(?\b(\d?\s*[A-Za-z]+)\s+(\d+):(\d+(?:-\d+)?)\)?/g, (m, b, c, v) => `... ${b.trim()}, chapter ${c}, verse ${v}. ... `);
      text = text.replace(/[—–]/g, ', ').replace(/”|"/g, ' ... ').replace(/“/g, ' ');
      text = text.replace(/\.\s+/g, '. ... ').replace(/;\s+/g, '; ... ').replace(/:\s+/g, ': ... ');
      return text.replace(/\s+/g, ' ').trim();
    }

    /* BARITONE VOICE SELECTION (DANIEL PRIORITY) */
    let availableVoices = [];
    function populateVoices() {
      if ('speechSynthesis' in window) availableVoices = speechSynthesis.getVoices();
    }
    populateVoices();
    if ('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoices;
    }

    function getSacredVoice() {
      if (!availableVoices || availableVoices.length === 0) populateVoices();
      const getIdentifier = (v) => `${v.name || ''} ${v.voiceURI || ''}`.toLowerCase();
      const englishVoices = availableVoices.filter(v => (v.lang && (v.lang.startsWith('en') || v.lang.startsWith('eng'))));

      const danielVoice = englishVoices.find(v => {
        const id = getIdentifier(v);
        return id.includes('daniel') && (id.includes('en-gb') || id.includes('en_gb') || id.includes('great britain') || id.includes('united kingdom') || id.includes('en-us'));
      });
      if (danielVoice) return danielVoice;

      const appleMale = englishVoices.find(v => {
        const id = getIdentifier(v);
        return (id.includes('arthur') || id.includes('oliver') || id.includes('george') || id.includes('rishi')) && !id.includes('female');
      });
      if (appleMale) return appleMale;

      const androidMale = englishVoices.find(v => {
        const id = getIdentifier(v);
        return id.includes('google uk english male') || id.includes('google us english male') || id.includes('male');
      });
      if (androidMale) return androidMale;

      return englishVoices[0] || availableVoices[0] || null;
    }

    let activeUtterance = null;
    let currentlyPlayingVerseIndex = -1;
    let isChapterPlaying = false;
    let syncInterval = null;

    function stopAllBibleAudio() {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      stopBibleMusic();
      if (syncInterval) clearInterval(syncInterval);
      currentlyPlayingVerseIndex = -1;
      isChapterPlaying = false;
      listenChapBtn.innerHTML = "🔊 Listen Chapter";
      document.querySelectorAll(".verse-row").forEach(r => r.classList.remove("playing-verse"));
      document.querySelectorAll(".verse-listen-btn").forEach(b => b.innerHTML = "🔊");
    }

    function narrateSingleVerse(index) {
      if (!('speechSynthesis' in window)) return;
      if (currentlyPlayingVerseIndex === index && speechSynthesis.speaking) {
        stopAllBibleAudio();
        return;
      }
      stopAllBibleAudio();

      const v = currentLoadedVerses[index];
      if (!v) return;

      currentlyPlayingVerseIndex = index;
      const row = document.getElementById(`verseRow_${index}`);
      const btn = document.getElementById(`verseBtn_${index}`);
      if (row) row.classList.add("playing-verse");
      if (btn) btn.innerHTML = "⏸";

      const book = bookSelect.value;
      const chapter = chapterSelect.value;
      const cadenceText = preprocessBibleText(`${book}, chapter ${chapter}, verse ${v.verse}. ${v.text}`);

      activeUtterance = new SpeechSynthesisUtterance(cadenceText);
      const voice = getSacredVoice();
      if (voice) activeUtterance.voice = voice;
      activeUtterance.rate = 0.84;
      activeUtterance.pitch = 0.78;

      activeUtterance.onstart = () => startBibleMusic();
      activeUtterance.onend = () => stopAllBibleAudio();
      activeUtterance.onerror = () => stopAllBibleAudio();

      setTimeout(() => speechSynthesis.speak(activeUtterance), 50);
    }

    function toggleChapterAudio() {
      if (!('speechSynthesis' in window)) return;
      if (isChapterPlaying) {
        stopAllBibleAudio();
        return;
      }
      stopAllBibleAudio();

      if (currentLoadedVerses.length === 0) return;

      isChapterPlaying = true;
      listenChapBtn.innerHTML = "⏸ Pause Chapter";
      startBibleMusic();

      let verseIdx = 0;
      const book = bookSelect.value;
      const chapter = chapterSelect.value;

      function speakNextVerse() {
        if (!isChapterPlaying || verseIdx >= currentLoadedVerses.length) {
          stopAllBibleAudio();
          return;
        }

        document.querySelectorAll(".verse-row").forEach(r => r.classList.remove("playing-verse"));
        const row = document.getElementById(`verseRow_${verseIdx}`);
        if (row) {
          row.classList.add("playing-verse");
          row.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        const v = currentLoadedVerses[verseIdx];
        const intro = verseIdx === 0 ? `${book} chapter ${chapter}. Verse ${v.verse}. ${v.text}` : `Verse ${v.verse}. ${v.text}`;
        const cadenceText = preprocessBibleText(intro);

        activeUtterance = new SpeechSynthesisUtterance(cadenceText);
        const voice = getSacredVoice();
        if (voice) activeUtterance.voice = voice;
        activeUtterance.rate = 0.84;
        activeUtterance.pitch = 0.78;

        activeUtterance.onend = () => {
          verseIdx++;
          speakNextVerse();
        };

        activeUtterance.onerror = () => stopAllBibleAudio();
        speechSynthesis.speak(activeUtterance);
      }

      syncInterval = setInterval(() => {
        if (!speechSynthesis.speaking && verseIdx >= currentLoadedVerses.length) {
          stopAllBibleAudio();
        }
      }, 300);

      speakNextVerse();
    }

    function initBookDropdown() {
      const otGroup = document.createElement("optgroup");
      otGroup.label = "Old Testament";
      const ntGroup = document.createElement("optgroup");
      ntGroup.label = "New Testament";

      BIBLE_BOOKS.forEach(b => {
        const opt = document.createElement("option");
        opt.value = b.name;
        opt.textContent = b.name;
        if (b.testament === "OT") otGroup.appendChild(opt);
        else ntGroup.appendChild(opt);
      });

      bookSelect.appendChild(otGroup);
      bookSelect.appendChild(ntGroup);
      bookSelect.value = "John";
      handleBookChange(3);
    }

    async function handleBookChange(targetChapter = 1) {
      const bookObj = BIBLE_BOOKS.find(b => b.name === bookSelect.value);
      chapterSelect.innerHTML = "";
      chapterPills.innerHTML = "";

      for (let i = 1; i <= bookObj.chapters; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Chapter ${i}`;
        chapterSelect.appendChild(opt);

        const pill = document.createElement("button");
        pill.className = `chap-pill ${i === targetChapter ? 'active' : ''}`;
        pill.textContent = i;
        pill.onclick = () => {
          chapterSelect.value = i;
          loadCurrentChapter();
        };
        chapterPills.appendChild(pill);
      }

      chapterSelect.value = targetChapter;
      await loadCurrentChapter();
    }


    function renderLoadedVerses(verses, sourceLabel) {
      currentLoadedVerses = Array.isArray(verses) ? verses : [];
      versesContainer.innerHTML = currentLoadedVerses.map(function(v, index) {
        return '<div class="verse-row" id="verseRow_' + index + '" data-verse="' + Number(v.verse) + '">' +
          '<span class="verse-num">' + Number(v.verse) + '</span>' +
          '<span class="verse-text">' + escapeHtml((v.text || "").trim()) + '</span>' +
          '<div class="actions-wrap">' +
            '<button class="verse-listen-btn" id="verseBtn_' + index + '" onclick="narrateSingleVerse(' + index + ')">🔊</button>' +
            '<button class="reflect-btn" onclick="triggerReflectByIndex(' + index + ')">✝ Reflect</button>' +
            '<button class="reflect-btn" onclick="prayVerseByIndex(' + index + ')">🙏 Pray</button>' +
          '</div>' +
        '</div>';
      }).join("");

      const status = document.getElementById("offlineBibleStatus");
      if (status && sourceLabel) status.textContent = sourceLabel;
    }

    async function loadCurrentChapter() {
      stopAllBibleAudio();
      const book = bookSelect.value;
      const chapter = Number(chapterSelect.value);

      document.querySelectorAll(".chap-pill").forEach(function(p) {
        p.classList.toggle("active", Number(p.textContent) === chapter);
      });

      passageHeader.textContent = book + " " + chapter;
      versesContainer.innerHTML = '<div class="loading-spinner">🕊️ Opening local Scripture...</div>';

      const engine = window.ONEINTOONE_BIBLE;
      if (!engine) {
        versesContainer.innerHTML = '<p style="text-align:center;color:#e07a5f;">Local Bible engine is unavailable. Please reload once while online.</p>';
        return;
      }

      try {
        const verses = await engine.getChapter(book, chapter);
        if (!verses.length) throw new Error("No verses found");
        renderLoadedVerses(
          verses,
          navigator.onLine ? "World English Bible · preparing full offline library" : "Offline · World English Bible"
        );
      } catch (err) {
        currentLoadedVerses = [];
        versesContainer.innerHTML = '<p style="text-align:center;color:#e07a5f;">This Bible book has not finished preparing on this device yet. Reconnect once and keep 1into1 open briefly while the offline Bible completes.</p>';
      }
    }

    function renderBibleSearchResults(results, title) {
      const box = document.getElementById("bibleSearchResults");
      if (!box) return;
      box.className = "bible-search-results visible";

      if (!results || !results.length) {
        box.innerHTML = '<p style="font-size:12px;color:var(--text-secondary);margin:0;">No matching verses found on this device yet.</p>';
        return;
      }

      const heading = title
        ? '<div style="font-size:11px;font-weight:800;color:var(--gold);">' + escapeHtml(title) + '</div>'
        : "";

      box.innerHTML = heading + results.map(function(result, index) {
        return '<button class="bible-search-result" type="button" data-search-index="' + index + '">' +
          '<strong>' + escapeHtml(result.reference) + '</strong>' +
          '<span>' + escapeHtml(result.text) + '</span>' +
        '</button>';
      }).join("");

      box.querySelectorAll("[data-search-index]").forEach(function(button) {
        button.addEventListener("click", function() {
          const result = results[Number(button.dataset.searchIndex)];
          if (result) openBibleSearchResult(result.book, result.chapter, result.startVerse);
        });
      });
    }

    async function runBibleSearch() {
      const input = document.getElementById("bibleSearchInput");
      const box = document.getElementById("bibleSearchResults");
      const query = input ? input.value.trim() : "";
      if (!query || !window.ONEINTOONE_BIBLE) return;

      if (box) {
        box.className = "bible-search-results visible";
        box.innerHTML = '<div class="loading-spinner" style="padding:16px 0;">Searching local Scripture…</div>';
      }

      try {
        const results = await window.ONEINTOONE_BIBLE.search(query, {
          limit:24,
          onProgress:function(progress) {
            if (!box || progress.done >= progress.total) return;
            box.innerHTML = '<div style="font-size:11px;color:var(--text-secondary);">Searching ' +
              escapeHtml(progress.book || "Scripture") + " · " + progress.done + "/" + progress.total + "</div>";
          }
        });
        renderBibleSearchResults(results, 'Results for “' + query + '”');
      } catch (err) {
        if (box) {
          box.innerHTML = '<p style="font-size:12px;color:#e07a5f;margin:0;">Search could not finish. If this is the first visit, reconnect briefly while the offline Bible prepares.</p>';
        }
      }
    }

    async function showBibleTopic(topicId) {
      const box = document.getElementById("bibleSearchResults");
      if (!window.ONEINTOONE_BIBLE) return;

      if (box) {
        box.className = "bible-search-results visible";
        box.innerHTML = '<div class="loading-spinner" style="padding:16px 0;">Gathering Scripture…</div>';
      }

      const results = await window.ONEINTOONE_BIBLE.topic(topicId);
      const title = topicId.charAt(0).toUpperCase() + topicId.slice(1) + " · Scripture anchors";
      renderBibleSearchResults(results, title);
    }

    async function openBibleSearchResult(book, chapter, verse) {
      bookSelect.value = book;
      await handleBookChange(Number(chapter));

      requestAnimationFrame(function() {
        const row = document.querySelector('.verse-row[data-verse="' + Number(verse) + '"]');
        if (!row) return;
        row.classList.add("search-hit");
        row.scrollIntoView({ behavior:"smooth", block:"center" });
        window.setTimeout(function() { row.classList.remove("search-hit"); }, 3200);
      });
    }

    function initBibleSearchUI() {
      const searchButton = document.getElementById("bibleSearchBtn");
      const searchInput = document.getElementById("bibleSearchInput");
      const topicStrip = document.getElementById("bibleTopicStrip");

      if (searchButton) searchButton.addEventListener("click", runBibleSearch);
      if (searchInput) {
        searchInput.addEventListener("keydown", function(event) {
          if (event.key === "Enter") runBibleSearch();
        });
      }

      if (topicStrip && window.ONEINTOONE_BIBLE_MANIFEST) {
        const labels = {
          anxiety:"Anxiety", grief:"Grief", money:"Money", relationships:"Relationships",
          forgiveness:"Forgiveness", sleep:"Sleep", guidance:"Guidance", health:"Health",
          loneliness:"Loneliness", anger:"Anger"
        };
        topicStrip.innerHTML = Object.keys(window.ONEINTOONE_BIBLE_MANIFEST.topics).map(function(topicId) {
          return '<button class="topic-chip" type="button" data-topic="' + topicId + '">' + labels[topicId] + '</button>';
        }).join("");
        topicStrip.querySelectorAll("[data-topic]").forEach(function(button) {
          button.addEventListener("click", function() { showBibleTopic(button.dataset.topic); });
        });
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }


    function triggerReflectByIndex(index) {
      const v = currentLoadedVerses[index];
      if (!v) return;

      const book = bookSelect.value;
      const chapter = chapterSelect.value;
      const cleanVerseText = v.text.trim().replace(/\r?\n|\r/g, " ");
      const prompt = 'Help me understand and reflect on ' + book + " " + chapter + ":" + v.verse +
        ': "' + cleanVerseText + '". Explain the context and what I should notice in this passage.';

      window.location.href = "/?prompt=" + encodeURIComponent(prompt) + "&mode=study&_cb=" + Date.now();
    }

    function prayVerseByIndex(index) {
      const v = currentLoadedVerses[index];
      if (!v) return;

      const book = bookSelect.value;
      const chapter = chapterSelect.value;
      const cleanVerseText = v.text.trim().replace(/\r?\n|\r/g, " ");
      const prompt = 'Help me pray ' + book + " " + chapter + ":" + v.verse +
        ' into my life today: "' + cleanVerseText + '". Keep the prayer grounded in this Scripture and give me one practical next step.';

      window.location.href = "/?prompt=" + encodeURIComponent(prompt) + "&mode=prayer&_cb=" + Date.now();
    }


    document.addEventListener("visibilitychange", () => { if (document.hidden) stopAllBibleAudio(); });
    async function initBibleOfflineMode() {
      const status = document.getElementById("offlineBibleStatus");
      const update = () => {
        if (!status) return;
        status.textContent = navigator.onLine
          ? "Online · chapters you open are saved for offline reading"
          : "Offline · previously opened chapters remain available";
      };
      update();
      window.addEventListener("online", update);
      window.addEventListener("offline", update);
      if ("serviceWorker" in navigator) {
        try {
          await navigator.serviceWorker.register("/service-worker.js", { scope: "/" });
          await navigator.serviceWorker.ready;
        } catch (err) {
          console.warn("Bible offline registration note:", err);
        }
      }
    }

    window.onload = () => {
      initBibleOfflineMode();
      initBibleSearchUI();
      updateBibleMusicUI();
      initBookDropdown();
    };
  </script>
</body>
</html>
